<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Class Attendance{% endblock %}</title>
  <style>
    :root{
      --indigo:#4f46e5; --indigo-d:#4338ca; --ink:#1f2937; --muted:#6b7280;
      --bg:#f4f5fb; --card:#ffffff; --line:#e5e7eb; --green:#059669; --red:#dc2626;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      background:var(--bg);color:var(--ink);line-height:1.5}
    a{color:var(--indigo);text-decoration:none}
    .nav{display:flex;align-items:center;justify-content:space-between;
      background:linear-gradient(90deg,var(--indigo),var(--indigo-d));
      color:#fff;padding:14px 26px;box-shadow:0 2px 10px rgba(79,70,229,.25)}
    .nav .brand{font-weight:700;font-size:1.12rem;letter-spacing:.2px}
    .nav .links a{color:#e8e7fb;margin-left:22px;font-weight:500;font-size:.95rem}
    .nav .links a:hover{color:#fff}
    .container{max-width:1000px;margin:30px auto;padding:0 20px}
    h1{font-size:1.5rem;margin:0 0 4px}
    .sub{color:var(--muted);margin:0 0 24px}
    .grid{display:grid;gap:18px}
    .stats{grid-template-columns:repeat(3,1fr)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
      padding:20px 22px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
    .stat .num{font-size:2rem;font-weight:700;color:var(--indigo)}
    .stat .lbl{color:var(--muted);font-size:.9rem;margin-top:2px}
    table{width:100%;border-collapse:collapse;margin-top:6px}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.94rem}
    th{color:var(--muted);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
    .btn{display:inline-block;background:var(--indigo);color:#fff;border:none;
      padding:10px 18px;border-radius:9px;font-weight:600;font-size:.92rem;cursor:pointer}
    .btn:hover{background:var(--indigo-d)}
    .btn.ghost{background:#eef0fb;color:var(--indigo)}
    .badge{padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
    .badge.g{background:#d1fae5;color:var(--green)}
    .badge.r{background:#fee2e2;color:var(--red)}
    input,select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;
      font-size:.94rem;font-family:inherit;width:100%}
    label{display:block;font-size:.85rem;color:var(--muted);margin:0 0 4px}
    .row{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
    .row>div{flex:1;min-width:150px}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 10px}
    .section-title h2{font-size:1.15rem;margin:0}
    .muted{color:var(--muted)}
    .bar{height:8px;background:#eef0fb;border-radius:6px;overflow:hidden;min-width:80px}
    .bar>span{display:block;height:100%;background:var(--indigo)}
    img.result{max-width:100%;border-radius:12px;border:1px solid var(--line)}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="brand">🎓 AI Class Attendance</div>
    <div class="links">
      <a href="/">Accueil</a>
      <a href="/ui/students">Étudiants</a>
      <a href="/ui/attendance">Prise de présence</a>
      <a href="/ui/reports">Rapports</a>
      <a href="/ui/portail">Portail étudiant</a>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
